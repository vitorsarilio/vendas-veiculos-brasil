# Teste temporário: o GitHub Actions consegue consultar a lista e baixar os PDFs da Fenabrave?
# (alguns sites bloqueiam IPs de nuvem). Sai do repositório depois do teste.
name: Teste de download da Fenabrave

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  testar:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Lista oficial de relatórios (API JSON)
        run: |
          for ano in 2003 2026; do
            curl -sS --fail -A "vendas-veiculos-brasil/0.1 (+https://github.com/vitorsarilio/vendas-veiculos-brasil)" \
              -X POST -d "ano=$ano" https://www.fenabrave.org.br/portalv2/api/Emplacamentos -o "api_$ano.json"
            python3 -c "import json; b=json.load(open('api_$ano.json'))['data']['blocos']; print('$ano', len(b), 'relatorios, ex.:', b[0]['link'])"
            sleep 2
          done
      - name: Download de dois PDFs
        run: |
          for arq in 2_2003_01_2.pdf 2026_09_02.pdf; do
            curl -sS --fail -A "vendas-veiculos-brasil/0.1 (+https://github.com/vitorsarilio/vendas-veiculos-brasil)" \
              -o "$arq" "https://www.fenabrave.org.br/portal/files/$arq"
            echo "$arq: $(stat -c %s "$arq") bytes, inicio: $(head -c 5 "$arq")"
            test "$(head -c 5 "$arq")" = "%PDF-"
            sleep 2
          done
