# Evidence (framework estático "legacy", versão fixada em package.json).

# O site é publicado em https://vitorsarilio.github.io/vendas-veiculos-brasil/
deployment:
  basePath: /vendas-veiculos-brasil

appearance:
  default: system
  switcher: true

# Paleta própria: azul-cobalto + vermelho de lanterna, com tons que funcionam no claro e no escuro
theme:
  colorPalettes:
    default:
      light: ["#2747d6", "#ef4136", "#0f9f9a", "#f0a20f", "#7c4dde", "#2f9e5a", "#e0559b", "#5b6678"]
      dark:  ["#7290ff", "#ff6b5e", "#2fd0c8", "#ffc046", "#a988ff", "#56d38a", "#ff86bf", "#a0aabb"]
  colorScales:
    default:
      light: ["#e3e8fb", "#2747d6"]
      dark:  ["#1a2340", "#7290ff"]
  colors:
    primary:
      light: "#2747d6"
      dark: "#7290ff"
    accent:
      light: "#ef4136"
      dark: "#ff6b5e"
    base:
      light: "#ffffff"
      dark: "#0e1420"
    base-200:
      light: "#f3f5f9"
      dark: "#151d2c"
    base-300:
      light: "#dfe4ec"
      dark: "#27324a"
    base-heading:
      light: "#0f1729"
      dark: "#f3f5fa"
    base-content:
      light: "#2b3445"
      dark: "#cdd4e0"
    base-content-muted:
      light: "#687288"
      dark: "#8a96ad"
    info:
      light: "#0f9f9a"
      dark: "#2fd0c8"
    positive:
      light: "#1f8f4e"
      dark: "#56d38a"
    warning:
      light: "#d48a00"
      dark: "#ffc046"
    negative:
      light: "#d62f25"
      dark: "#ff6b5e"

plugins:
  components:
    "@evidence-dev/core-components": {}
  datasources:
    "@evidence-dev/duckdb": {}
